name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      MPLBACKEND: Agg
      TF_NUM_INTEROP_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the CPU test environment
        run: >-
          python -m pip install tensorflow-cpu==2.21.0 keras==3.14.0 numpy==2.4.4
          pillow==12.2.0 scipy==1.17.1 scikit-learn==1.8.0 h5py==3.14.0
          matplotlib==3.10.8 gradio==6.12.0
          pytest==9.2.0 ruff==0.17.3
      - name: Install the project package
        run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
