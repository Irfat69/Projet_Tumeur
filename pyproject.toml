[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-detection"
version = "0.1.0"
description = "Reproducible educational brain MRI classification and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["venv", ".venv", "outputs", "models"]

[tool.ruff.lint]
select = ["E9", "F"]
